version: "3"

# Convention: task <orchestrator>:<coder>
# Single name = same model for all roles

vars:
  BIN: "{{.ROOT_DIR}}/.venv/bin/code-factory"

tasks:
  default:
    desc: Run with Ling (all roles)
    cmds:
      - "{{.BIN}} -p ling"

  ling:
    desc: Ling for all roles (port 8081)
    cmds:
      - "{{.BIN}} -p ling"

  qwen:
    desc: Qwen for all roles (port 8082)
    cmds:
      - "{{.BIN}} -p qwen"

  deepseek:
    desc: DeepSeek for all roles
    cmds:
      - "{{.BIN}} -p deepseek"
    preconditions:
      - sh: test -n "$CODE_FACTORY_DEEPSEEK_API_KEY"
        msg: "Set CODE_FACTORY_DEEPSEEK_API_KEY first"

  # Mixed: task <orchestrator>:<coder>
  ling:qwen:
    desc: Ling orchestrator + Qwen coder
    env:
      CODE_FACTORY_MODEL_CODER: "qwen:qwen3-59b"
    cmds:
      - "{{.BIN}} -p ling"

  ling:deepseek:
    desc: Ling orchestrator + DeepSeek coder
    env:
      CODE_FACTORY_MODEL_CODER: "deepseek:deepseek-chat"
    cmds:
      - "{{.BIN}} -p ling"
    preconditions:
      - sh: test -n "$CODE_FACTORY_DEEPSEEK_API_KEY"
        msg: "Set CODE_FACTORY_DEEPSEEK_API_KEY first"

  deepseek:qwen:
    desc: DeepSeek orchestrator + Qwen coder
    env:
      CODE_FACTORY_MODEL_CODER: "qwen:qwen3-59b"
    cmds:
      - "{{.BIN}} -p deepseek"
    preconditions:
      - sh: test -n "$CODE_FACTORY_DEEPSEEK_API_KEY"
        msg: "Set CODE_FACTORY_DEEPSEEK_API_KEY first"

  # Custom flags
  run:
    desc: "Custom: task run -- -p qwen -m openai-chat:my-model"
    cmds:
      - "{{.BIN}} {{.CLI_ARGS}}"

  # Utility
  install:
    desc: Install code-factory in editable mode
    cmds:
      - uv pip install -e .

  vault:
    desc: Show vault git log
    cmds:
      - git -C {{.VAULT_PATH}} log --oneline -20
    vars:
      VAULT_PATH: ~/Documents/dev/code-factory-repo
